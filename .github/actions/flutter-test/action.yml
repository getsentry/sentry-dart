name: Flutter tests
description: Run Flutter tests
inputs:
  directory:
    description: The directory to run tests in
    required: false
    default: ''
  flutter-version:
    description: The Flutter version to install instead of the latest version on the matrix channel
    required: false
    default: ''

runs:
  using: composite

  steps:
    - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # pin@v2.18.0
      with:
        channel: ${{ matrix.sdk }}
        flutter-version: ${{ inputs.flutter-version }}

    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      if: ${{ matrix.target == 'android' }}
      with:
        java-version: '17'
        distribution: 'temurin'

    # Install required dependencies for Flutter on Linux on Ubuntu
    - name: 'Setup Linux'
      if: matrix.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq -y cmake dbus libblkid-dev libgtk-3-dev liblzma-dev ninja-build pkg-config xvfb libcurl4-openssl-dev network-manager upower

    - run: flutter pub get
      shell: bash
      working-directory: ${{ inputs.directory }}

    - name: Test VM
      if: (matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos') && inputs.directory != 'packages/isar' && !(inputs.directory == 'packages/flutter' && (matrix.target == 'linux' || matrix.target == 'windows'))
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: flutter test --test-randomize-ordering-seed=random --file-reporter json:test-vm.jsonl

    - name: Test VM (isar)
      if: (matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos') && inputs.directory == 'packages/isar'
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: flutter test -j 1 --test-randomize-ordering-seed=random --file-reporter json:test-vm.jsonl

    - name: Test VM and native backends
      if: inputs.directory == 'packages/flutter' && (matrix.target == 'linux' || matrix.target == 'windows')
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: sh ../../.github/scripts/test-flutter-desktop.sh

    # Tests that fail after they already completed (async errors) flip the
    # exit code and failure count without the github reporter printing
    # which test failed. The JSON report still contains the error events,
    # so surface every test error here by name.
    - name: Report test failures hidden from the console reporter
      if: ${{ !cancelled() && (matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos') }}
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: |
        for report in test-vm.jsonl test-native-*.jsonl; do
          [[ -f "$report" ]] || continue
          jq -rs '
            (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test.name}) | add // {}) as $names
            | map(select(.type == "error")
              | ($names[.testID | tostring] // (.testID | tostring)) as $name
              | "FAILED: \($name)\n\(.error)\n\(.stackTrace // "")\n",
                ("::error title=Test failure::FAILED: \($name)\n\(.error)"
                  | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")))
            | .[]
          ' "$report" || true
        done

    - name: Test web (${{ matrix.target }})
      if: matrix.target == 'js' || matrix.target == 'wasm'
      working-directory: ${{ inputs.directory }}
      shell: bash
      run: |
        flutter test --platform chrome ${{ (matrix.target == 'wasm' && '--wasm') || '' }} --test-randomize-ordering-seed=random --exclude-tags canvasKit
        flutter test --platform chrome ${{ (matrix.target == 'wasm' && '--wasm') || '' }} --test-randomize-ordering-seed=random --tags canvasKit

name: Detect changes

# Tells caller workflows which platform jobs a pull request needs. Pushes and
# any change that is not platform-only select everything. See
# .github/scripts/detect-changes.ts for the rules.
on:
  workflow_call:
    outputs:
      shared:
        description: 'A change can affect every platform, such as Dart code'
        value: ${{ jobs.changes.outputs.shared }}
      android:
        description: 'Android jobs should run'
        value: ${{ jobs.changes.outputs.android }}
      cocoa:
        description: 'iOS and macOS jobs should run'
        value: ${{ jobs.changes.outputs.cocoa }}
      desktop:
        description: 'Linux and Windows jobs should run'
        value: ${{ jobs.changes.outputs.desktop }}
      web:
        description: 'Web jobs should run'
        value: ${{ jobs.changes.outputs.web }}
      flutter_targets:
        description: 'JSON array of sentry-flutter build targets to run'
        value: ${{ jobs.changes.outputs.flutter_targets }}

permissions: {}

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.select.outputs.shared }}
      android: ${{ steps.select.outputs.android }}
      cocoa: ${{ steps.select.outputs.cocoa }}
      desktop: ${{ steps.select.outputs.desktop }}
      web: ${{ steps.select.outputs.web }}
      flutter_targets: ${{ steps.select.outputs.flutter_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/file-filters.yml
          list-files: json

      - name: Select platform jobs
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        with:
          script: |
            const {detectChanges} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/detect-changes.ts`);
            detectChanges({core, eventName: process.env.EVENT_NAME, filterOutputs: JSON.parse(process.env.FILTER_OUTPUTS)});

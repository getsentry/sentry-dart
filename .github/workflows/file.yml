name: File
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '.github/workflows/file.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/dart-test/**'
      - 'packages/dart/**'
      - 'packages/file/**'
      - '!**/*.md'
      - '!**/class-diagram.svg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: '${{ matrix.platform }} (${{ matrix.sdk }})'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos, ubuntu, windows]
        sdk: [stable, beta]
        include:
          - os: macos
            platform: macOS
          - os: ubuntu
            platform: Linux
          - os: windows
            platform: Windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/dart-test
        with:
          directory: packages/file
          web: false

  package-analysis:
    name: Package Analysis
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/file

name: e2e-sentry-dart
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '!**/*.md'
      - '!**/class-diagram.svg'
      - '.github/workflows/e2e_dart.yml'
      - 'packages/dart/**'
      - 'e2e_test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SENTRY_AUTH_TOKEN_E2E: ${{ secrets.SENTRY_AUTH_TOKEN_E2E }}
  SENTRY_DIST: 1

jobs:
  build:
    name: E2E
    # Fork PRs do not receive secrets. Skip the live sentry.io round-trip
    # instead of failing. First-party CI still runs and must have the token.
    # Allowlist push / same-repo pull_request so other events (e.g.
    # pull_request_target) cannot be treated as first-party.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./e2e_test
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    steps:
      - name: Require E2E auth token
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN_E2E" ]; then
            echo "::error::SENTRY_AUTH_TOKEN_E2E is required for first-party CI"
            exit 1
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # pin@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run
        run: |
          dart pub get
          dart run --define=SENTRY_ENVIRONMENT=e2e

name: Update JavaScript SDK

# Split from update-deps.yml: the JavaScript SDK releases often and most
# releases don't affect Flutter Web, so it only updates once a week instead
# of daily and on every push to main.
on:
  schedule:
    # Mondays at 04:00 UTC.
    - cron: '0 4 * * 1'

permissions: {}

jobs:
  js:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The updater cancels previous runs of this workflow.
      actions: write
    steps:
      - uses: getsentry/github-workflows/updater@36529d71129a14967bea1fb81bcaf2a5943cf877 # v3
        with:
          path: packages/flutter/scripts/update-js.sh
          name: JavaScript SDK
          changelog-entry: false
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}

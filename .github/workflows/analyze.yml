name: Analyze

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  packages:
    name: ${{ matrix.name }}
    needs: changes
    # Platform-only changes touch no Dart code.
    if: needs.changes.outputs.shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dart
            package: packages/dart
            sdk: dart
          - name: dio
            package: packages/dio
            sdk: dart
          - name: drift
            package: packages/drift
            sdk: dart
          - name: e2e-dart
            package: e2e_test
            sdk: dart
          - name: file
            package: packages/file
            sdk: dart
          - name: firebase-remote-config
            package: packages/firebase_remote_config
            sdk: flutter
          - name: flutter
            package: packages/flutter
            sdk: flutter
          - name: grpc
            package: packages/grpc
            sdk: dart
          - name: hive
            package: packages/hive
            sdk: dart
          - name: isar
            package: packages/isar
            sdk: flutter
          - name: link
            package: packages/link
            sdk: dart
          - name: logging
            package: packages/logging
            sdk: dart
          - name: sqflite
            package: packages/sqflite
            sdk: flutter
          - name: supabase
            package: packages/supabase
            sdk: flutter
    uses: ./.github/workflows/analyze-package.yml
    with:
      package: ${{ matrix.package }}
      sdk: ${{ matrix.sdk }}

  required:
    # Preserve the existing ruleset context while analysis moves into this workflow.
    name: analyze / analyze
    if: ${{ always() }}
    needs: [changes, packages]
    runs-on: ubuntu-latest
    steps:
      # Package analysis may be skipped, but only when change detection succeeded and chose to skip it.
      - name: Fail unless package analysis passed or was skipped on purpose
        if: needs.changes.result != 'success' || (needs.packages.result != 'success' && needs.packages.result != 'skipped')
        run: exit 1

name: sentry-dart
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '!**/*.md'
      - '!**/class-diagram.svg'
      - '.github/workflows/dart.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/dart-test/**'
      - 'packages/dart/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: '${{ matrix.os }} | ${{ matrix.sdk }}'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        sdk:
          - '3.12'
          - stable
          - beta
        include:
          - os: windows
            sdk: stable
          - os: macos
            sdk: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/dart-test
        with:
          directory: packages/dart

      - name: Build example
        working-directory: packages/dart/example
        run: |
          dart pub get
          dart compile aot-snapshot bin/example.dart

  package-analysis:
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/dart

name: Dart
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '.github/workflows/dart.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/dart-test/**'
      - 'packages/dart/**'
      - '!**/*.md'
      - '!**/class-diagram.svg'
      # pana scores the README and CHANGELOG, so changing them still runs package analysis.
      - 'packages/dart/README.md'
      - 'packages/dart/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  build:
    name: '${{ matrix.platform }} (${{ matrix.sdk }})'
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        sdk:
          - '3.12'
          - stable
          - beta
        include:
          - os: ubuntu
            platform: Linux
          - os: windows
            platform: Windows
            sdk: stable
          - os: macos
            platform: macOS
            sdk: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/dart-test
        with:
          directory: packages/dart

      - name: Build example
        working-directory: packages/dart/example
        run: |
          dart pub get
          dart compile aot-snapshot bin/example.dart

  package-analysis:
    name: Package Analysis
    needs: changes
    if: needs.changes.outputs.pana == 'true'
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/dart

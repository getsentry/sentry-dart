name: sentry-supabase
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '!**/*.md'
      - '!**/class-diagram.svg'
      - '.github/workflows/supabase.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/dart-test/**'
      - 'packages/dart/**'
      - 'packages/flutter/**'
      - 'packages/supabase/**'

# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: '${{ matrix.target }} | ${{ matrix.sdk }}'
    runs-on: ${{ matrix.target == 'linux' && 'ubuntu' || matrix.target }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [macos, linux, windows]
        sdk: [stable, beta]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-test
        with:
          directory: packages/supabase

  package-analysis:
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/supabase
      sdk: flutter

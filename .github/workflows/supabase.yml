name: Supabase
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '.github/workflows/supabase.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/dart-test/**'
      - 'packages/dart/**'
      - 'packages/flutter/**'
      - 'packages/supabase/**'
      - '!**/*.md'
      - '!**/class-diagram.svg'
      # pana scores the README and CHANGELOG, so changing them still runs package analysis.
      - 'packages/supabase/README.md'
      - 'packages/supabase/CHANGELOG.md'

# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  build:
    name: '${{ matrix.platform }} (${{ matrix.sdk }})'
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ${{ matrix.target == 'linux' && 'ubuntu' || matrix.target }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [macos, linux, windows]
        sdk: [stable, beta]
        include:
          - target: macos
            platform: macOS
          - target: linux
            platform: Linux
          - target: windows
            platform: Windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/flutter-test
        with:
          directory: packages/supabase

  package-analysis:
    name: Package Analysis
    needs: changes
    if: needs.changes.outputs.pana == 'true'
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/supabase
      sdk: flutter

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      sdk:
        required: false
        type: string
        default: dart
      panaThreshold:
        description: Minimum number of points that must be achieved.
        required: false
        type: number
        default: 140

jobs:
  package-analysis:
    name: Pana
    # We run `pana` directly instead of the `axel-op/dart-package-analyzer`
    # action because that action's bundled Flutter SDK is frozen at 3.38.6 and
    # cannot resolve packages that require a newer Flutter (e.g. sentry_flutter
    # on 3.44+). Setting up the SDK ourselves lets pana use a current Flutter.
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') && inputs.panaThreshold > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # pin@v1.8.2
        if: ${{ inputs.sdk == 'dart' }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # pin@v2.21.0
        if: ${{ inputs.sdk == 'flutter' }}
        with:
          channel: stable
      # pana resolves a temporary copy without dependency overrides. Use absolute
      # paths throughout the checkout so transitive SDK dependencies resolve too.
      - name: Resolve workspace dependencies for pana
        working-directory: ${{ github.workspace }}
        shell: ruby {0}
        run: |
          require 'yaml'

          manifests = Dir[File.expand_path('packages/*/pubspec.yaml')].to_h do |file|
            [file, YAML.load_file(file)]
          end
          paths = manifests.to_h { |file, spec| [spec.fetch('name'), File.dirname(file)] }

          manifests.each do |file, spec|
            dependencies = spec['dependencies'] || {}
            local = dependencies.keys & paths.keys
            next if local.empty?

            local.each { |name| dependencies[name] = { 'path' => paths.fetch(name) } }
            File.write(file, YAML.dump(spec))
          end
      # Each package's CHANGELOG.md is a symlink to the root one. pana copies the
      # package into a temporary directory without following symlinks, so it
      # reports a missing changelog and deducts points. Materialise the content.
      - name: Materialise CHANGELOG symlink
        run: |
          if [[ -L CHANGELOG.md ]]; then
            cp --remove-destination "$(readlink -f CHANGELOG.md)" CHANGELOG.md
          fi
      - name: Run pana
        id: analysis
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --json > "$RUNNER_TEMP/pana.json"
          echo "total=$(jq -r '.scores.grantedPoints // 0' "$RUNNER_TEMP/pana.json")" >> "$GITHUB_OUTPUT"
          echo "total_max=$(jq -r '.scores.maxPoints // 0' "$RUNNER_TEMP/pana.json")" >> "$GITHUB_OUTPUT"
      - name: Check scores
        env:
          TOTAL: ${{ steps.analysis.outputs.total }}
          TOTAL_MAX: ${{ steps.analysis.outputs.total_max }}
          PANA_THRESHOLD: ${{ inputs.panaThreshold }}
        run: |
          if (( TOTAL < PANA_THRESHOLD )); then
            echo "Pana score check failed: ${TOTAL}/${TOTAL_MAX} points (minimum required: ${PANA_THRESHOLD})."
            exit 1
          else
            echo "Pana score check passed: ${TOTAL}/${TOTAL_MAX} points (minimum required: ${PANA_THRESHOLD})."
          fi

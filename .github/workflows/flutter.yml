name: sentry-flutter
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '.github/workflows/flutter.yml'
      - '.github/workflows/package-analysis.yml'
      - '.github/actions/flutter-test/**'
      - '.github/scripts/test-flutter-desktop.sh'
      - '.github/workflows/detect-changes.yml'
      - '.github/scripts/detect-changes.ts'
      - 'packages/dart/**'
      - 'packages/flutter/**'
      - 'metrics/flutter.properties'
      - '!**/*.md'
      - '!**/class-diagram.svg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  build:
    name: '${{ matrix.target }} | ${{ matrix.sdk }}'
    needs: changes
    if: needs.changes.outputs.flutter_targets != '[]'
    # The target list is computed, so the runner comes from the target instead of a matrix include.
    runs-on: ${{ (matrix.target == 'ios' || matrix.target == 'macos') && 'macos-15' || matrix.target == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.flutter_targets) }}
        sdk: [stable, beta]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QuickFix for failing iOS 18.0 builds https://github.com/actions/runner-images/issues/12758#issuecomment-3187115656
      - name: Switch to Xcode 16.4 for iOS 18.5
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      # Flutter derives the local SwiftPM package identity from the plugin path basename on macOS.
      # Our package lives in packages/flutter, which makes Xcode resolve it as "flutter" and fail with:
      # "unable to override package 'sentry_flutter' because its identity 'flutter' doesn't match override's identity (directory name) 'sentry_flutter'"
      - name: Rename sentry_flutter package for macOS SwiftPM
        if: matrix.target == 'macos'
        run: mv packages/flutter packages/sentry_flutter

      - uses: ./.github/actions/flutter-test
        with:
          directory: ${{ matrix.target == 'macos' && 'packages/sentry_flutter' || 'packages/flutter' }}

      - name: Prepare example for ${{ matrix.target }}
        # The example depends on Hive and Isar, which do not compile to Wasm.
        if: matrix.target != 'wasm'
        working-directory: ${{ matrix.target == 'macos' && 'packages/sentry_flutter/example' || 'packages/flutter/example' }}
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop
          TARGET=${{ matrix.target }}
          flutter pub get

      - name: Build example for ${{ matrix.target }}
        if: matrix.target != 'wasm'
        working-directory: ${{ matrix.target == 'macos' && 'packages/sentry_flutter/example' || 'packages/flutter/example' }}
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          clear_swiftpm_cache() {
            bash ../../../.github/scripts/clear-swiftpm-cache.sh
          }
          case $TARGET in
          ios)
          flutter build ios --no-codesign || {
            clear_swiftpm_cache
            flutter build ios --no-codesign
          }
          ;;
          macos)
          flutter build macos || {
            clear_swiftpm_cache
            flutter build macos
          }
          ;;
          android)
          flutter build appbundle
          ;;
          js)
          flutter build web
          ;;
          linux)
          flutter build linux
          ;;
          windows)
          flutter build windows
          ;;
          esac

  package-analysis:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    uses: ./.github/workflows/package-analysis.yml
    with:
      package: packages/flutter
      sdk: flutter

  swift-lint:
    needs: changes
    if: needs.changes.outputs.cocoa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # pin@3.2.1
        with:
          args: --strict

  ktlint:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ktlint
        uses: ScaCap/action-ktlint@26c5e9b625966139d9956cbbb6217375480d4e14 # pin@1.9.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          android: true
          fail_on_error: true

  proguard-rules-verify:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate proguard rules from the JNI class list
        run: ./scripts/generate-sentry-java-proguard.sh

      - name: Fail if proguard rules are out of sync with the JNI class list
        run: |
          diff_output=$(git diff -- android/proguard-rules.pro)
          if [[ -n "$diff_output" ]]; then
            echo "$diff_output"
            echo "::error::android/proguard-rules.pro is out of sync with tool/jnigen.dart. Run packages/flutter/scripts/generate-sentry-java-proguard.sh and commit the result."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # pin@v2.21.0
        with:
          channel: stable

      - name: Verify R8 keeps every io.sentry.* class from tool/jnigen.dart
        run: ./scripts/verify-proguard-mapping.sh

name: Native SDK Bump Recheck

# The updater force-pushes new versions to the same branch, which Junior's
# PR-opened automation does not see. Mentioning Junior on each push makes it
# re-check the new Cocoa/Android version for known issues.
on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  request-recheck:
    if: >-
      github.head_ref == 'deps/packages/flutter/scripts/update-cocoa.sh' ||
      github.head_ref == 'deps/packages/flutter/scripts/update-android.sh' ||
      github.head_ref == 'ci/native-bump-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: '@sentry-junior recheck native SDK bump',
            });

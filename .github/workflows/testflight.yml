name: Upload to Testflight
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    paths:
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

# Same shape as other workflows (workflow + branch), but fall back to github.ref
# instead of run_id. On push, head_ref is empty and run_id is unique, so that
# fallback would not cancel overlapping main uploads of the same TestFlight app.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  upload_to_testflight:
    name: Build and Upload to Testflight
    # Bot PRs (dependabot, renovate) can't access the signing secrets, so the upload would fail anyway.
    if: github.event.pull_request.user.type != 'Bot'
    # Build with the iOS 27 SDK; App Store Connect flags older SDKs (ITMS-90725).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # pin@v2.21.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # pin@v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: flutter
        working-directory: ./packages/flutter/example
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --target=lib/ios_profile_probe.dart

      - name: Install Fastlane
        working-directory: ./packages/flutter/example/ios
        run: bundle install

      - name: Build the signed TestFlight IPA
        working-directory: ./packages/flutter/example/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          FASTLANE_BUNDLE_VERSION: ${{ github.run_number }}
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: DEBUG
        run: |
          bundle exec fastlane bump_build_number
          bundle exec fastlane build_release
          ipa=build/sentry_flutter_sample.ipa
          unzip -p "$ipa" Payload/Runner.app/Frameworks/App.framework/App > "$RUNNER_TEMP/ipa-app"
          symbols=../build/symbols/app.ios-arm64.symbols
          app_uuid=$(xcrun dwarfdump --uuid "$RUNNER_TEMP/ipa-app" | awk '$3 == "(arm64)" {print $2}')
          symbol_uuid=$(xcrun dwarfdump --uuid "$symbols" | awk '$3 == "(arm64)" {print $2}')
          test -n "$app_uuid"
          test "$app_uuid" = "$symbol_uuid"
          xcrun dwarfdump --name=mixProfilePixels "$symbols" > "$RUNNER_TEMP/probe-dwarf.txt"
          grep -q mixProfilePixels "$RUNNER_TEMP/probe-dwarf.txt"
          echo "Profiling IPA matches Dart symbol UUID $app_uuid"
          unzip -p "$ipa" Payload/Runner.app/Info.plist > "$RUNNER_TEMP/ipa-info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/ipa-info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/ipa-info.plist"

      - name: Upload Symbols to Sentry
        working-directory: ./packages/flutter/example
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: >
          dart run sentry_dart_plugin
          --sentry-define=release=flutter-ios-profile@testflight.1
          --sentry-define=build_path=build/symbols
          --sentry-define=upload_sources=false
          --sentry-define=upload_source_maps=false
          --sentry-define=commits=false

      - name: Upload the processed-symbol build to TestFlight
        working-directory: ./packages/flutter/example/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: bundle exec fastlane upload_testflight

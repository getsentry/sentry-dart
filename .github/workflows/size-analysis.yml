name: Size Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'metrics/flutter.properties'
      - '.github/workflows/size-analysis.yml'
      - '.github/actions/size-analysis-setup/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'metrics/flutter.properties'
      - '.github/workflows/size-analysis.yml'
      - '.github/actions/size-analysis-setup/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SENTRY_ORG: sentry-sdks
  SENTRY_PROJECT: sentry-flutter
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/detect-changes.yml

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/flutter/example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ./.github/actions/size-analysis-setup

      - name: Build Android Appbundle
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name "$SIZE_VERSION" \
            --build-number "$SIZE_BUILD"

      - name: Upload Android Bundle to Sentry Size Analysis
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          sentry-cli build upload \
            "build/app/outputs/bundle/release/app-release.aab" \
            --org "${{ env.SENTRY_ORG }}" \
            --project "${{ env.SENTRY_PROJECT }}" \
            --build-configuration "Release"

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.cocoa == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/flutter/example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/size-analysis-setup

      - name: Build Flutter iOS
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/symbols \
            --build-name "$SIZE_VERSION" \
            --build-number "$SIZE_BUILD"

      - name: Upload iOS XCArchive to Sentry Size Analysis
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          sentry-cli build upload \
            "build/ios/archive/Runner.xcarchive" \
            --org "${{ env.SENTRY_ORG }}" \
            --project "${{ env.SENTRY_PROJECT }}" \
            --build-configuration "Release"

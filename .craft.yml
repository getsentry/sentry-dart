minVersion: 3.9.0
changelog:
  policy: auto
preReleaseCommand: bash scripts/bump-version.sh
artifactProvider:
  name: none
targets:
  - name: pub-dev
    # Validation resolves dependencies with the Dart SDK in the craft Docker
    # image, which is older than our minimum Dart SDK, so it fails.
    # Remove once the craft image ships a Dart SDK that satisfies our constraint.
    skipValidation: true
    packages:
      packages/dart:
      packages/flutter:
      packages/logging:
      packages/dio:
      packages/file:
      packages/sqflite:
      packages/hive:
      packages/drift:
      packages/isar:
      packages/link:
      packages/firebase_remote_config:
      packages/supabase:
      packages/grpc:
  - name: github
  - name: registry
    sdks:
      pub:sentry:
      pub:sentry_flutter:
      pub:sentry_logging:
      pub:sentry_dio:
      pub:sentry_file:
      pub:sentry_sqflite:
      pub:sentry_drift:
      pub:sentry_hive:
      pub:sentry_isar:
      pub:sentry_link:
      pub:sentry_firebase_remote_config:
      pub:sentry_supabase:
      pub:sentry_grpc:

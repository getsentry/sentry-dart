import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext.kotlin_version = '2.3.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
// android.builtInKotlin lets a project opt out of AGP 9's built-in Kotlin and fall back to the
// standalone plugin, so it must be honored in addition to the AGP version.
def builtInKotlin = agpMajor >= 9 && project.findProperty('android.builtInKotlin') != 'false'

if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdkVersion 37

    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'io.sentry.flutter'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 37

        ndk {
            // Flutter does not currently support building for x86 Android (See Issue 9253).
            abiFilters("armeabi-v7a", "x86_64", "arm64-v8a")
        }
    }

    buildTypes {
        release {
            consumerProguardFiles 'proguard-rules.pro'
        }
        debug {
            consumerProguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

// compilerOptions needs KGP 2.0 / 1.9+. Flutter 3.24-era apps (and this
// repo's min_version_test) still ship KGP 1.8.x, which only has kotlinOptions.
def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    api 'io.sentry:sentry-android:8.53.0'
    debugImplementation 'io.sentry:sentry-spotlight:8.53.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // Required -- JUnit 4 framework
    testImplementation "junit:junit:4.13.2"
}

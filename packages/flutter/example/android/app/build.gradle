plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Disabled by default because symbol upload fails on CI when SENTRY_AUTH_TOKEN
    // is unavailable (e.g. on fork PRs). Uncomment together with the sentry { } block
    // below to upload ProGuard mappings to Sentry.
    // id "io.sentry.android.gradle"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "io.sentry.flutter.sample"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        languageVersion = System.getenv("KOTLIN_LANGUAGE_VERSION") ?: "2.3"
    }

    compileSdkVersion 37

    // Consume the sentry-native-ndk Prefab package instead of building our own copy.
    buildFeatures {
        prefab true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "io.sentry.flutter.sample"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        externalNativeBuild {
            cmake {
                arguments.addAll([
                    "-DANDROID_STL=c++_static",
                    // https://developer.android.com/guide/practices/page-sizes#compile-r27
                    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                ])
            }
        }

        ndk {
            // Flutter does not currently support building for x86 Android (See Issue 9253).
            abiFilters("armeabi-v7a", "x86_64", "arm64-v8a")
        }
    }

    ndkVersion "27.2.12479018"

    externalNativeBuild {
        cmake {
            setPath("CMakeLists.txt")
        }
    }

    buildTypes {
        release {
            // looks like Flutter requires minifyEnabled to be enabled or it throws
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    // Was android:extractNativeLibs="true" in AndroidManifest.xml; AGP 9 only
    // accepts it from the build script. Keeps native libs extracted at install
    // time, which sentry-native's crash handler relies on.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lintOptions {
        // workaround if using AGP 4.0 on release mode
        // https://github.com/flutter/flutter/issues/58247
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.annotation:annotation:1.1.0"
    // Declared directly so AGP exposes its Prefab package to CMake; the
    // transitive copy is runtime-scoped and Prefab never sees it. That also
    // means the compile classpath carries no version for it, so unlike the
    // other Sentry artifacts this one has to be pinned here. Keep it in sync
    // with the version io.sentry:sentry-android-ndk depends on.
    implementation "io.sentry:sentry-native-ndk:0.16.2"
}

// Disabled by default because symbol upload fails on CI when SENTRY_AUTH_TOKEN
// is unavailable (e.g. on fork PRs). Uncomment together with the
// io.sentry.android.gradle plugin above to upload ProGuard mappings to Sentry.
// sentry {
//     autoInstallation {
//       enabled = false
//     }
//     org = "sentry-sdks"
//     projectName = "sentry-flutter"
//     authToken = System.getenv("SENTRY_AUTH_TOKEN")
// }
